# Publishes a GitHub release for each SkorneX version: whenever VERSION
# changes on main (or a v* tag is pushed), it makes the tag v<version> and a
# release with that version's notes from CHANGELOG.md. Marked as a
# pre-release while SkorneX is in alpha (0.x). Run it by hand from the
# Actions tab to (re)publish the current version.
name: Release
on:
  push:
    branches: [main]
    paths: [VERSION]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version and notes
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(cat VERSION)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          awk -v v="$v" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "SkorneX $v" > notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already released."
            exit 0
          fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "SkorneX $VERSION" \
            --notes-file notes.md --prerelease
