# Generated by skornex-theme from theme/templates/hypr/hyprlock.conf. Edit the template, not this file.
# Black, a clock, a password box. Add blocks here to add things.

general {
    hide_cursor = true
}

background {
    monitor =
    color = rgb(${BG})
}

label {
    monitor =
    text = cmd[update:1000] date +'%I:%M'
    color = rgb(${TEXT})
    font_size = 64
    font_family = Maple Mono NF
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 44
    outline_thickness = 1
    dots_center = true
    outer_color = rgb(${BORDER})
    inner_color = rgb(${SURFACE})
    font_color = rgb(${TEXT})
    check_color = rgb(${ACCENT})
    fail_color = rgb(${URGENT})
    placeholder_text = Password
    fade_on_empty = false
    position = 0, -30
    halign = center
    valign = center
}
